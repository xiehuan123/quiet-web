<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><title>广告净化本站暂停测试</title></head>

    <header><nav id="site-nav"><a href="#content">正文</a></nav></header>

    <section id="protected-paywall" data-ad aria-label="Advertisement" data-paywall>订阅后阅读的付费墙</section>

    <div id="dialog-decoy" role="dialog">普通 dialog</div>
    <div id="popup-class-decoy" class="ad-popup">仅类名含 ad/popup 的普通内容</div>
