<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><title>广告净化页面过滤测试</title><script src="/ticket2.js" defer></script></head>

    <header><nav id="primary-nav"><a href="#article">阅读正文</a></nav></header>

    <form id="login" data-ad aria-label="Advertisement"><label>密码 <input type="password"></label></form>

    <section aria-label="动态内容测试"><button id="insert-ad" type="button">插入动态广告</button><div id="dynamic-root"></div></section>
